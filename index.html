<style>
/* Layout: the printed nüde card, front then back, stacked as one phone-width card. Single brand look (grey stock, nüde red ink) in both themes. */
:root{
  --page:#d3d3d1; --stock:#e4e4e3; --red:#941a1f; --ink:#191716; --muted:#6f6a68; --line:#cfcac9;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:light;
}
body{background:var(--page);color:var(--red);font-family:var(--mono);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px}
.card{max-width:420px;margin:0 auto;background:var(--stock);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(25,23,22,.08),0 12px 32px rgba(25,23,22,.10)}
.front{padding:24px 22px 26px;display:grid;gap:26px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.05;margin:0;color:var(--red)}
.role{font-size:14px;margin-top:4px}
.group{font-weight:500;font-size:12px;letter-spacing:.04em;padding-top:6px}
.logo{display:block;width:62%;max-width:100%;margin:6px auto 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;padding:12px;border-radius:10px;font:500 14px var(--mono);text-decoration:none;border:1.5px solid var(--red);color:var(--red);background:transparent}
.btn.primary{background:var(--red);color:var(--stock)}
.btn:focus-visible,.copy:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
ul{list-style:none;margin:0;padding:4px 0;border-top:1px solid var(--line)}
li{display:flex;align-items:center;gap:12px;padding:12px 22px}
li+li{border-top:1px solid var(--line)}
.val{min-width:0;flex:1}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.val a,.val span{color:var(--red);text-decoration:none;word-break:break-all;user-select:all}
.copy{flex:none;font:500 12px var(--mono);color:var(--red);background:none;border:1px solid var(--red);border-radius:999px;padding:5px 12px;cursor:pointer}
.back{border-top:1px solid var(--line);padding:24px 22px 22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.bird{width:100%;max-width:150px}
.qr-box{background:#fff;padding:10px;border-radius:10px;width:150px}
.qr-box svg{display:block;width:100%;height:auto}
.foot{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;gap:12px;flex-wrap:wrap}
.foot span:last-child{color:var(--muted)}
@media (max-width:360px){.back{grid-template-columns:1fr;justify-items:center}}
*{box-sizing:border-box}
body{margin:0;padding-top:max(28px,env(safe-area-inset-top));padding-bottom:max(28px,env(safe-area-inset-bottom))}
.save{grid-column:1/-1;background:var(--red);color:var(--stock)}
</style>
</head><body>
